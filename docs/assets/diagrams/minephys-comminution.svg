<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="t d" class="psd">
  <title id="t">minephys.comminution: modules and the mine-to-mill chain</title>
  <desc id="d">Top row: the mine-to-mill chain turns a blast passing curve into class masses, a crusher product, a cumulative passing curve, the F80 size, a specific energy from Bond or Morrell, and a throughput equal to installed power over specific energy. Bottom row: the population balance mill, the flotation kinetics and the two-product formula, which stand alone, and the knowledge rows every closed form reads.</desc>
  <style>
    .psd{--bg:#ffffff;--surface:#f7f4fb;--surface-2:#eee8f5;--fg:#1b1523;--fg-muted:#5c5468;--border:#ddd6e6;
      --border-strong:#7d7589;--primary:#7500c0;--code:#7500c0;--accent:#a100ff;--primary-soft:#f1e3ff;--danger:#b42318;
      --success:#067647;--warning:#93370d;--info:#175cd3;--chart-1:#7500c0;--chart-2:#0e7c86;--chart-3:#c2410c;
      --chart-4:#1d4ed8;--chart-5:#be185d;--chart-6:#4d7c0f}
    @media (prefers-color-scheme: dark){.psd{--bg:#0f0b14;--surface:#1a1521;--surface-2:#251e2e;--fg:#f4f0f8;
      --fg-muted:#b7aec3;--border:#352c40;--border-strong:#8c829b;--primary:#a100ff;--code:#be82ff;--accent:#be82ff;
      --primary-soft:#2e1a47;--danger:#fda29b;--success:#75e0a7;--warning:#fec84b;--info:#84adff;--chart-1:#be82ff;
      --chart-2:#2dd4bf;--chart-3:#fb923c;--chart-4:#60a5fa;--chart-5:#f472b6;--chart-6:#a3e635}}
    .bg{fill:var(--bg)}
    .band{fill:var(--surface);stroke:var(--border);stroke-width:1}
    .box{fill:var(--surface-2);stroke:var(--border-strong);stroke-width:1.5}
    .box-accent{fill:var(--primary-soft);stroke:var(--accent);stroke-width:2}
    .title{font:600 15px Inter,system-ui,sans-serif;fill:var(--fg)}
    .path{font:13px "JetBrains Mono",ui-monospace,monospace;fill:var(--code)}
    .item{font:13px Inter,system-ui,sans-serif;fill:var(--fg-muted)}
    .caveat{font:italic 13px Inter,system-ui,sans-serif;fill:var(--warning)}
    .label{font:13px Inter,system-ui,sans-serif;fill:var(--fg)}
    .edge{stroke:var(--fg-muted);stroke-width:1.5;fill:none}
    .edge-accent{stroke:var(--accent);stroke-width:2.2;fill:none}
    .arrowhead{fill:var(--fg-muted)}
    .arrowhead-accent{fill:var(--accent)}
    .bandtitle{font:600 15px Inter,system-ui,sans-serif;fill:var(--fg-muted)}
    .planned{fill:var(--surface-2);stroke:var(--border-strong);stroke-width:1.5;stroke-dasharray:6 4}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <rect class="bg" width="1100" height="560"/>
  <rect class="band" x="20" y="20" width="1060" height="290" rx="8"/>
  <text class="bandtitle" x="36" y="44">Mine-to-mill chain (mine_to_mill_chain, _size.py)</text>
  <rect class="box" x="36" y="70" width="175" height="64" rx="6"/>
  <text class="path" x="48" y="94">class_masses</text>
  <text class="item" x="48" y="114">m_i = P(s_i) - P(s_i+1)</text>
  <rect class="box" x="226" y="70" width="175" height="64" rx="6"/>
  <text class="path" x="238" y="94">crusher_matrix_model</text>
  <text class="item" x="238" y="114">p = (I-C)(I-BC)^-1 f</text>
  <rect class="box" x="416" y="70" width="175" height="64" rx="6"/>
  <text class="path" x="428" y="94">cumulative_passing</text>
  <text class="item" x="428" y="114">P_i = sum of m_k, k >= i</text>
  <rect class="box" x="606" y="70" width="175" height="64" rx="6"/>
  <text class="path" x="618" y="94">passing_size</text>
  <text class="item" x="618" y="114">F80 and fines fraction</text>
  <rect class="box" x="796" y="70" width="175" height="64" rx="6"/>
  <text class="path" x="808" y="94">bond_energy / morrell</text>
  <text class="item" x="808" y="114">W from F80 to target P80</text>
  <line class="edge" x1="211" y1="102" x2="226" y2="102" marker-end="url(#arrow)"/>
  <line class="edge" x1="401" y1="102" x2="416" y2="102" marker-end="url(#arrow)"/>
  <line class="edge" x1="591" y1="102" x2="606" y2="102" marker-end="url(#arrow)"/>
  <line class="edge" x1="781" y1="102" x2="796" y2="102" marker-end="url(#arrow)"/>
  <text class="label" x="36" y="170">Input: blast passing curve P(s) on upper class sizes (for example a Swebrec curve of minephys.blasting).</text>
  <rect class="box-accent" x="226" y="190" width="175" height="64" rx="6"/>
  <text class="path" x="238" y="214">whiten_classification</text>
  <text class="item" x="238" y="234">c(x), k1, k2, k3</text>
  <line class="edge" x1="313" y1="190" x2="313" y2="134" marker-end="url(#arrow)"/>
  <text class="item" x="420" y="214">Crusher inputs: classification c_i and breakage matrix b_ij (strictly lower triangular).</text>
  <rect class="box-accent" x="796" y="190" width="175" height="64" rx="6"/>
  <text class="path" x="808" y="214">throughput</text>
  <text class="item" x="808" y="234">P_installed / W  (kg/s)</text>
  <line class="edge-accent" x1="883" y1="134" x2="883" y2="190" marker-end="url(#arrow)"/>
  <text class="caveat" x="36" y="290">Steady state, one pass; crusher parameters are inputs; Austin and Whiten forms are UNVERIFIED attributions.</text>
  <rect class="band" x="20" y="330" width="1060" height="210" rx="8"/>
  <text class="bandtitle" x="36" y="354">Stand-alone models (_pbm.py, _flotation.py, _energy.py)</text>
  <rect class="box" x="36" y="380" width="175" height="64" rx="6"/>
  <text class="path" x="48" y="404">pbm_batch_grinding</text>
  <text class="item" x="48" y="424">m(t) = expm(At) m(0)</text>
  <rect class="box" x="226" y="380" width="175" height="64" rx="6"/>
  <text class="path" x="238" y="404">pbm_continuous_mill</text>
  <text class="item" x="238" y="424">(I - (tau/N) A)^-N m_in</text>
  <rect class="box" x="416" y="380" width="175" height="64" rx="6"/>
  <text class="path" x="428" y="404">austin_selection</text>
  <text class="item" x="428" y="424">S_i, b_ij forms (UNVERIFIED)</text>
  <rect class="box" x="606" y="380" width="175" height="64" rx="6"/>
  <text class="path" x="618" y="404">flotation_*</text>
  <text class="item" x="618" y="424">first order, Klimpel, cells</text>
  <rect class="box" x="796" y="380" width="175" height="64" rx="6"/>
  <text class="path" x="808" y="404">two_product_recovery</text>
  <text class="item" x="808" y="424">yield and recovery from grades</text>
  <rect class="planned" x="36" y="470" width="935" height="50" rx="6"/>
  <text class="path" x="48" y="492">knowledge/comminution.yaml</text>
  <text class="item" x="48" y="511">Every closed-form constant is a cited row read at call time (get_value); the Bond and Morrell limits warn.</text>
</svg>
