schema_version: 1
table: haulage
title: Haulage constants and parameters
licence: CC-BY-4.0
rows:
- id: diesel_co2_kg_per_us_gal
  quantity: diesel fuel combustion CO₂ emission factor
  value: 10.21
  units: kg CO₂ / US gal
  role: parameter
  citation: epa2025ghghub
  page: Table 2, p. 2
  verification: verified
  verified_on: '2026-10-06'
  symbol: minephys.haulage.co2_from_diesel
  notes: combustion (tank-to-wheel) CO₂ only; the CH₄ and N₂O factors are in Table 5 (p. 3) of the same document
- id: diesel_electric_fuel_to_wheel_efficiency
  quantity: marginal efficiency of a diesel-electric haul truck from fuel energy to wheel energy (engine, generator, rectifier, DC bus, motor, gear)
  value: 0.354
  units: '1'
  role: parameter
  citation: lindgren2022
  page: Table 2, p. 7
  verification: verified
  verified_on: '2026-11-25'
  symbol:
  - minephys.haulage.trolley_cycle_energy
  notes: 'Derived: 0.40 (Table 2, "ca 40% efficiency, fuel to DC-power", marginal diesel consumption 0.253 l/kWh) times
    0.885 (the DC-bus-to-wheel row). Uncertainty: the source gives "ca 40%" with no interval; the authors inferred their
    parameters from truck specifications and recorded fuel consumption (p. 4) and their modelled DC-bus energy matched the
    measured 361 kWh per cycle within 1 % (358 kWh, p. 5), which checks the DC-bus energy, not this efficiency. The value is
    marginal: the load-independent consumption of 50 l/h in Table 2 is excluded, so a cycle-average efficiency from the tank is lower.'
- id: electric_dc_bus_to_wheel_efficiency
  quantity: efficiency of the electric drive from the DC bus to the wheel (motors, power electronics, gears), forward
  value: 0.885
  units: '1'
  role: parameter
  citation: lindgren2022
  page: Table 2, p. 7
  verification: verified
  verified_on: '2026-11-25'
  symbol:
  - minephys.haulage.trolley_cycle_energy
  notes: 'Derived: 1 - 0.115 from "Loss from DC-bus to wheel, same in reverse at regeneration" 11.5 % (Table 2). Boundary: it
    starts at the DC bus; pantograph, contact-line, rectifier and feeder losses are not in it (the authors estimate the mine
    distribution loss at 2.63 %, p. 14, for one truck on a 500 m line). Uncertainty: the source gives no interval; the loss is a
    model parameter inferred by the authors from truck specifications (p. 4) and was not measured on its own.'
- id: battery_electric_battery_to_wheel_efficiency
  quantity: efficiency of a battery-electric haul truck from battery terminals to the wheel when discharging
  value: 0.85845
  units: '1'
  role: parameter
  citation: lindgren2022
  page: Table 2, p. 7
  verification: verified
  verified_on: '2026-11-25'
  symbol:
  - minephys.haulage.bev_cycle_energy
  notes: 'Derived: (1 - 0.115) times (1 - 0.03), the DC-bus-to-wheel loss and the "Resistive loss in battery and DC/DC converter at
    1C charge/discharge rate" 3 % (Table 2), the battery loss applied once. Uncertainty: the authors call the battery and
    power-electronics losses "highly uncertain since it is a new system that is yet to be developed" (p. 13); the 3 % holds at
    a 1C rate and no interval is given.'
- id: battery_electric_regeneration_efficiency
  quantity: electrical efficiency of regenerative braking from the wheel to the battery terminals
  value: 0.85845
  units: '1'
  role: parameter
  citation: lindgren2022
  page: Table 2, p. 7
  verification: verified
  verified_on: '2026-11-25'
  symbol:
  - minephys.haulage.bev_cycle_energy
  notes: 'Derived: the DC-bus-to-wheel loss is "the same in reverse at regeneration" (Table 2), so (1 - 0.115) times (1 - 0.03).
    Boundary: electrical conversion only. It is an upper bound on the recovered share of braking energy, because friction
    braking and the practical electric braking power of 3300 kW (Table 2, note b) are not modelled. Uncertainty: no interval is
    given; the battery part is "highly uncertain" (p. 13).'
- id: diesel_lower_heating_value_j_per_m3
  quantity: lower heating value of low-sulfur diesel fuel per unit volume
  value: 35811696091.9353
  units: J/m³
  role: parameter
  citation: afdc2026fuelproperties
  page: Fuel Properties Comparison, row Low Sulfur Diesel, lower heating value (128,488 Btu/gal)
  verification: verified
  verified_on: '2026-11-25'
  symbol:
  - minephys.haulage.fuel_use
  notes: 'Converted: 128,488 Btu/gal times 1055.05585262 J/Btu (International Table Btu) divided by 3.785411784e-3 m3/gal, which is
    35.81 MJ/l; the page does not say which Btu it uses (the thermochemical Btu would change the value by 0.03 %). The page
    cites the GREET 2019 input fuel specifications of Argonne National Laboratory for it. Uncertainty: the page gives one
    value and no interval; heating value varies with fuel grade. Cross-check: Table 2 of lindgren2022 (0.253 l/kWh at ca 40 %)
    implies 35.57 MJ/l, 0.7 % lower. The higher heating value on the same page is 138,490 Btu/gal and is not this row.'
