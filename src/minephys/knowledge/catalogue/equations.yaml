  - id: comminution_pbm_batch_grinding
    title: Batch grinding population balance
    domain: comminution
    latex: '\mathbf{m}(t) = e^{At}\,\mathbf{m}(0), \quad A = -\operatorname{diag}(S) + B\operatorname{diag}(S)'
    symbols:
      - {symbol: '\mathbf{m}', meaning: class masses coarse to fine, units: kg}
      - {symbol: S, meaning: selection (breakage rate) of each class, units: 1/s}
      - {symbol: B, meaning: breakage matrix (strictly lower triangular), units: "1"}
      - {symbol: t, meaning: grinding time, units: s}
    function: minephys.comminution.pbm_batch_grinding
    citation: reid1965batch
    page: not read (bibliographic)
    verification: UNVERIFIED
    notes: the analytical three-class solution is derived in spec 005 section 7 and is the test oracle
  - id: comminution_pbm_continuous_mill
    title: Perfectly mixed continuous mill, tanks in series
    domain: comminution
    latex: '\mathbf{m}_{out} = \left(I - \frac{\tau}{N}A\right)^{-N}\mathbf{m}_{in}'
    symbols:
      - {symbol: '\mathbf{m}', meaning: class mass flows coarse to fine, units: kg/s}
      - {symbol: A, meaning: rate matrix -diag(S) + B diag(S), units: 1/s}
      - {symbol: '\tau', meaning: total mean residence time, units: s}
      - {symbol: N, meaning: number of equal tanks in series, units: "1"}
    function: minephys.comminution.pbm_continuous_mill
    citation: austin1984ballmilling
    page: not read (bibliographic, 1984 edition)
    verification: UNVERIFIED
    notes: derived in spec 005 section 7 from the steady balance of one tank
  - id: comminution_austin_selection
