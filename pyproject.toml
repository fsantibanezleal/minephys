[project]
name = "minephys"
version = "0.0.0"
description = "Sourced, tested reference implementations of mining-engineering models with cited parameter tables"
readme = "README.md"
authors = [{ name = "Felipe A. Santibanez-Leal" }]
classifiers = ["Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Topic :: Scientific/Engineering"]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
]  # minimal and Pyodide-safe; added with `uv add`, versions written by the resolver

[dependency-groups]
dev = [
    "diff-cover>=10.6.0",
    "hypothesis>=6.168.3",
    "jsonschema>=4.26.0",
    "mutmut>=3.8.0",
    "mypy>=2.4.0",
    "poethepoet>=0.48.0",
    "pyslope>=1.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.10",
    "scipy>=1.18.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PERF", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
# the locked test files cannot be reformatted or rewritten (tests.lock), so style rules that only touch layout are off
"tests/**" = ["E501", "PT018", "RUF001", "RUF007", "UP031", "SIM102", "RUF005", "PERF401", "F401", "W292", "RUF100"]

[tool.ruff.format]
exclude = ["tests/**"]

[tool.pytest]
minversion = "9.0"
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers", "-p", "_hypothesis_profiles"]
testpaths = ["tests"]
markers = [
    "req(id): links a test to a requirement ID",
    "oracle(kind, reference): the source of the expected values (analytical, worked-example, reference-implementation, hand-calculation)",
    "knowledge(row_id): pins a verified knowledge-table row",
    "gpu: needs CUDA",
    "slow: long-running",
    "pyodide: needs the Pyodide runtime (CI job only)",
    "kit: needs an NVIDIA Kit installation (local only)",
]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
files = ["src"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mutmut]
paths_to_mutate = ["src/minephys/_validate.py", "src/minephys/_solve.py", "src/minephys/_random.py", "src/minephys/units.py"]
tests_dir = ["tests/unit/", "tests/property/"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "PT018", "RUF001", "RUF007", "UP031", "SIM102", "RUF005", "PERF401", "F401"]

[tool.ruff.format]
exclude = ["tests/**"]
